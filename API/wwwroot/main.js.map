<div class="container mt-5">
    <div style="text-align: center;">
       <h1>Find your match</h1>
       <p class="lead">Come on in to view your matches... all you need to do is sign up!</p>
       <div class="text-center" *ngIf="!(accountService.currentUser$ | async)">
          <a routerLink="/register" class="btn btn-primary btn-lg me-2">Register</a>
          <a routerLink="/login" class="btn btn-success btn-lg me-2">Login</a>
          <button class="btn btn-info btn-lg">Learn more</button>
       </div>
       <div class="text-center" *ngIf="accountService.currentUser$ | async as user">
          <p class="lead">Welcome back, {{ user.knownAs || user.username }}!</p>
          <a routerLink="/members" class="btn btn-primary btn-lg me-2">View Matches</a>
       </div>
    </div>
</div>
