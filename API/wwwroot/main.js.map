<!-- <p *ngFor="let message of messages ">{{message?.content}}</p> -->
<div class="row mb-4">

  <div class="btn btn-group m" name="Container">
    <button class="btn btn-primary" btnRadio="Unread" [(ngModel)]="container"
     (click)="loadMessages()">
     <i class="fa fa-envelope"></i>Unread
    </button>
    <button class="btn btn-primary" btnRadio="Inbox" [(ngModel)]="container"
     (click)="loadMessages()">
     <i class="fa fa-envelope-open"></i>Inbox
    </button>
    <button class="btn btn-primary" btnRadio="Outbox" [(ngModel)]="container"
     (click)="loadMessages()">
     <i class="fa fa-paper-plane"></i>Outbox
    </button>
  </div>
</div>


<!-- hỏi xem có = 0  -->

<div class="row " *ngIf="messages?.length ===0">
  <h3>No message</h3>
</div>
<!--  thiết kế các thẻ table -->

<div class="row" *ngIf="messages?.length! > 0">
  <table class="table table-error" style="cursor: pointer">
    <tr>
      <th style="width: 40%">Messages</th>
      <th style="width: 20%">Form / To</th>
      <th style="width: 20%">Sent / Received</th>
      <th style="width: 20%"></th>
    </tr>

    <tr [hidden]="loading" *ngFor="let message of messages"
    routerLink='{{container === "Outbox"
    ? "/members/" + message.recipientUsername
    : "/members/" + message.senderUsername}}'
    [queryParams]="{tab: 3}">
      <td>{{message.content}}</td>

      <td>
        <div *ngIf="container === 'Outbox'">
          <img
          class="img-circle rounded-circle mr-2 "
          src="{{message.recipientPhotoUrl || './assets/user.png'}}"
          alt="{{message.recipientUsername}}">
          <strong>{{message.recipientUsername | titlecase}}</strong>
        </div>
        <div *ngIf="container !== 'Outbox'">
          <img
          class="img-circle rounded-circle mr-2 "
          src="{{message.senderPhotoUrl || './assets/user.png'}}"
          alt="{{message.senderUsername}}">
          <strong>{{message.senderUsername | titlecase}}</strong>
        </div>
      </td>

      <td>{{message.messageSent | timeago}}</td>
      <td>
        <button (click)="$event.stopPropagation()" (click)="deleteMessage(message.id)" class="btn btn-danger btn-color">Delete</button>
        <!--(click)="$event.stopPropagation()" là 1 sự kiện đc xử lý trc khi deletemassage
        nó ngăn chặn các sự kiện click từ lan rộng đến các phần tử bên trong nut delete
      giúp ngăn chặn các sự kiện k mong muốn xảy ra khi nút delete đc nhấn
       -->
      </td>
    </tr>

  </table>
</div>
<div class="d-flex justify-content-center" *ngIf="pagination && !loading">
  <pagination
     [boundaryLinks]="true"
     [totalItems]="pagination.totalItems"
     [itemsPerPage]="pagination.itemsPerPage"
     [(ngModel)]="pagination.currentPage"
     (pageChanged)="pageChanged($event)"
     previousText="&lsaquo;"
     nextText="&rsaquo;"
     firstText="&laquo;"
     lastText="&raquo;">
</pagination>
