<div class="form-group">
  <input type="text"
  [class.is-invalid]='ngControl.touched && ngControl.invalid'
  class='form-control mb-3'
  [formControl]='control'
  placeholder="{{label}}"
  bsDatepicker
  [bsConfig]='bsConfig'
  [maxDate]='maxDate'
  />
  <div *ngIf="control.errors?.required" class="invalid-feedback">{{label}}</div>
</div>
